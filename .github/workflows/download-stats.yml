name: Download stats

# Daily digest of downloads.termio.sh: pulls yesterday's download / active-Mac
# numbers from Cloudflare's GraphQL Analytics API, appends them to a CSV ledger
# on the orphan `stats` branch (Cloudflare's free plan only retains ~7 days, so
# the running total has to be accumulated), and posts a summary to Telegram.
#
# Required repo secrets:
#   CF_ANALYTICS_TOKEN   Cloudflare API token, Zone > Analytics > Read on termio.sh
#   CF_ZONE_ID           termio.sh zone id (same value as CLOUDFLARE_ZONE_ID)
#   TELEGRAM_BOT_TOKEN   from @BotFather
#   TELEGRAM_CHAT_ID     chat id to post into

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC daily — yesterday (UTC) is a complete day
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to report (YYYY-MM-DD); blank = yesterday"
        required: false

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for the script)
        uses: actions/checkout@v7

      - name: Checkout stats ledger
        uses: actions/checkout@v7
        with:
          ref: stats
          path: _stats

      - name: Collect + post
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/download_stats.py \
            --csv _stats/downloads.csv \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Commit ledger
        run: |
          cd _stats
          git config user.name  "termio-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add downloads.csv
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(stats): $(date -u +%F) download digest"
          git push
