name: iOS

# Compile check for the iOS companion app and the shared package. Path-filtered
# so landing-page or macOS-only pushes never spin a (metered) macOS runner; the
# macOS app has its own pipeline in release.yml.
on:
  push:
    branches: [main, dev]
    paths:
      - "ios/**"
      - "Shared/**"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "Shared/**"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same config and severity split as the macOS workflow.
      - name: Lint
        run: |
          which swiftlint || brew install swiftlint
          swiftlint lint --reporter github-actions-logging

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project ios/TermioMobile.xcodeproj \
            -scheme TermioMobile \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
