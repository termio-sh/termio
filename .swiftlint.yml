# Encodes only the hard conventions from AGENTS.md — no force-unwraps or other
# trapping shortcuts. Style beyond that is the reviewer's call, not the linter's.
only_rules:
  - force_unwrapping
  - force_try
  - force_cast

# Errors fail CI. force_unwrapping stays a warning while the existing sites are
# worked off — new code should not add to them.
force_try:
  severity: error
force_cast:
  severity: error

included:
  - Sources
  - Shared/Sources
  - Tests
  - ios/Sources

excluded:
  # Vendored: deviations are tracked in file headers, upstream style stays.
  - Sources/termio/Editor/Highlightr
  # Generated by scripts/gen_langicons.py.
  - Shared/Sources/TermioShared/LangIconCatalog.swift
