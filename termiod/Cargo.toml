[package]
name = "termiod"
version = "0.1.0"
edition = "2021"
description = "termiod — durable PTY session host (POC). Detach ≠ kill."
license = "MIT"

# `vt` is a workspace member, and a default one, so a bare `cargo test` — which
# is what CI runs — covers the snapshot boundary's own tests. Without this it
# silently tests only this package, and anything asserted inside `vt` never runs.
[workspace]
members = ["vt"]
default-members = [".", "vt"]

[[bin]]
name = "termiod"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros", "signal", "time", "process"] }
bytes = "1"
termiod-vt = { path = "vt" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# WebSocket framing for the browser pipe, and nothing else: no `connect`, no
# `native-tls`, no `rustls`. TLS stays in Tailscale Serve or Caddy, because
# "never embed crypto" is the trust story, not a performance opinion.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# The Sink/Stream halves of that socket. Already in the tree underneath
# tokio-tungstenite; named here only because splitting the stream needs the
# extension traits. No executor, no io, no compat shims.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
