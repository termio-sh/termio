[package]
name = "termiod-vt"
version = "0.1.0"
edition = "2021"
publish = false

# The engine build (Zig, cross-target, static archive) and the raw FFI both live
# in `libghostty-vt`, so this crate carries no vendored source and no build
# script. What stays here is termiod's own snapshot boundary: the wire cell is
# ours, not the engine's.
#
# Pinned to upstream Uzaaft/libghostty-rs, which builds ghostty's `vt-1.0.1`
# tag (108cacb): libghostty-vt's first stable C ABI, whose CI rejects any
# change that is not an addition. termio keeps no fork and no patch series
# here. A fix termio needs goes to ghostty or libghostty-rs, not into a patch.
#
# Bump by moving `rev` to a libghostty-rs commit that builds a newer `vt-*`
# tag. The crate checks its bindings in and regenerates them with each ghostty
# pin, so never point GHOSTTY_SOURCE_DIR at a different ghostty: that builds
# and then corrupts the heap.
#
# The Mac and iOS clients decode this engine's native snapshot with the
# ghostty libghostty-swift ships, so the two need not match exactly, but the
# snapshot envelope version must: ghostty's `snapshot/envelope.zig`.
#
# Needs Rust 1.96 or newer, libghostty-rs's minimum.
[dependencies]
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb" }
png = "0.18"
crc32fast = "1"
