[package]
name = "termiod-vt"
version = "0.1.0"
edition = "2021"
publish = false

# The engine build (Zig, cross-target, static archive) and the raw FFI both live
# in `libghostty-vt`, so this crate carries no vendored source and no build
# script. What stays here is termiod's own snapshot boundary: the wire cell is
# ours, not the engine's.
#
# Pinned to termio-sh/libghostty-rs, our fork, which builds ghostty b699ea7 —
# the same one libghostty-swift ships to the Mac and iOS clients, so the host
# and its clients run one VT. That parity is why this engine was chosen over
# alacritty_terminal in the first place.
#
# It has to be a fork rather than a rev bump: `libghostty-vt-sys` checks its
# bindings in, so they must be regenerated against the ghostty they build.
# Pointing GHOSTTY_SOURCE_DIR at a different one does not fail to build — it
# corrupts the heap. Bumping ghostty here means bumping the fork's
# GHOSTTY_COMMIT and regenerating in the same commit, never one without the
# other.
#
# The fork also carries a patch series against that ghostty, under its
# `Patches/ghostty/`, applied to the pinned checkout at build time. `0001` stops
# the Vt formatter emitting blank cells under the preceding run's style, which
# made every snapshot replay paint a background the host's screen never held —
# the black rectangle beside Claude Code's banner. Delete the patch when ghostty
# lands the fix; a patch that no longer applies fails the build rather than
# being skipped.
#
# Track libghostty-swift when it releases: its title carries the ghostty it
# built (`1.1.6 · ghostty v1.3.1-2878-gb699ea7`), and that sha is the one to
# match here. Since ghostty#13759 dropped iOS from the full build, that release
# also carries a patch putting iOS back, so the two forks move together.
[dependencies]
libghostty-vt = { git = "https://github.com/termio-sh/libghostty-rs", rev = "3b8db629a22602be815779e6d10d182a2a8d93d4" }
